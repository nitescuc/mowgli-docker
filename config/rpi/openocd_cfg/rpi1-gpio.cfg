#
# Config for using Raspberry Pi's expansion header
#
# This is best used with a fast enough buffer but also
# is suitable for direct connection if the target voltage
# matches RPi's 3.3V and the cable is short enough.
#
# Do not forget the GND connection, pin 6 of the expansion header.
#

adapter driver bcm2835gpio

bcm2835gpio peripheral_base 0x20000000

# Transition delay calculation: SPEED_COEFF/khz - SPEED_OFFSET
# These depend on system clock, calibrated for stock 700MHz
# bcm2835gpio_speed SPEED_COEFF SPEED_OFFSET
bcm2835gpio speed_coeffs 113714 28

# Each of the SWD lines need a gpio number set: swclk swdio
adapter gpio swclk 17
adapter gpio swdio 18
# If you define trst or srst, use appropriate reset_config

# Header pin number: 26
# bcm2835gpio_trst_num 7
# reset_config trst_only

# Header pin number: 12
adapter gpio srst 18
reset_config srst_only srst_push_pull

# If you have both connected,
# reset_config trst_and_srst srst_push_pull

transport select swd
